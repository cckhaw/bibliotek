name: Temporary Vercel deployment cleanup

on:
  workflow_dispatch:

concurrency:
  group: vercel-deployment-cleanup
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Verify the Vercel project and deployment scope
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::This cleanup must run from the main branch."
            exit 1
          fi
          node --input-type=module <<'NODE'
          const api = "https://api.vercel.com";
          const expectedLink = { org: "cckhaw", repo: "bibliotek" };
          const { VERCEL_TOKEN: token, VERCEL_PROJECT_ID: projectId, VERCEL_TEAM_ID: teamId } = process.env;

          for (const [name, value] of Object.entries({ VERCEL_TOKEN: token, VERCEL_PROJECT_ID: projectId, VERCEL_TEAM_ID: teamId })) {
            if (!value) throw new Error(`Required repository secret ${name} is unavailable.`);
          }

          async function request(path) {
            const response = await fetch(`${api}${path}`, {
              headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
            });
            if (!response.ok) throw new Error(`Vercel API request failed with HTTP ${response.status}.`);
            return response.json();
          }

          const teamQuery = new URLSearchParams({ teamId });
          const project = await request(`/v9/projects/${encodeURIComponent(projectId)}?${teamQuery}`);
          if (
            project.id !== projectId ||
            !["github", "github-limited"].includes(project.link?.type) ||
            project.link.org !== expectedLink.org ||
            project.link.repo !== expectedLink.repo
          ) {
            throw new Error("The configured Vercel project is not unambiguously linked to cckhaw/bibliotek.");
          }

          async function listAllDeployments() {
            const deployments = new Map();
            const cursors = new Set();
            let until;
            for (let page = 0; page < 1000; page += 1) {
              const query = new URLSearchParams({ projectId, teamId, limit: "100" });
              if (until !== undefined) query.set("until", String(until));
              const result = await request(`/v7/deployments?${query}`);
              if (!Array.isArray(result.deployments) || !result.pagination) {
                throw new Error("Vercel returned an unexpected deployment-list response.");
              }
              for (const deployment of result.deployments) {
                if (
                  !deployment ||
                  deployment.projectId !== projectId ||
                  typeof deployment.uid !== "string" ||
                  !deployment.uid.startsWith("dpl_") ||
                  !Number.isSafeInteger(Number(deployment.created)) ||
                  Number(deployment.created) <= 0 ||
                  typeof deployment.state !== "string" ||
                  typeof deployment.readyState !== "string" ||
                  !Object.hasOwn(deployment, "target")
                ) {
                  throw new Error("A deployment has incomplete or mismatched identity data.");
                }
                const previous = deployments.get(deployment.uid);
                if (previous && JSON.stringify(previous) !== JSON.stringify(deployment)) {
                  throw new Error(`Deployment ${deployment.uid} changed between pagination pages.`);
                }
                deployments.set(deployment.uid, deployment);
              }
              const next = result.pagination.next;
              if (next === null) return [...deployments.values()];
              const cursor = Number(next);
              if (!Number.isSafeInteger(cursor) || cursor <= 0 || cursors.has(cursor) || (until !== undefined && cursor >= until)) {
                throw new Error("Vercel returned an invalid or non-advancing pagination cursor.");
              }
              cursors.add(cursor);
              until = cursor;
            }
            throw new Error("Deployment pagination exceeded the safety limit.");
          }

          function classify(deployment) {
            if (deployment.customEnvironment) {
              throw new Error(`Deployment ${deployment.uid} uses a custom environment; cleanup scope is ambiguous.`);
            }
            if (deployment.target === "production") return "production";
            if (deployment.target === null) return "preview";
            throw new Error(`Deployment ${deployment.uid} has an unsupported target; cleanup scope is ambiguous.`);
          }

          const active = (await listAllDeployments()).filter(
            (deployment) => deployment.state !== "DELETED" && deployment.readyState !== "DELETED" && !deployment.deleted,
          );
          const production = active.filter((deployment) => classify(deployment) === "production");
          for (const deployment of active) classify(deployment);
          if (production.length === 0) throw new Error("No active production deployment was found.");
          const latest = production.reduce(
            (timestamp, deployment) => Math.max(timestamp, Number(deployment.created)),
            -Infinity,
          );
          if (production.filter((deployment) => Number(deployment.created) === latest).length !== 1) {
            throw new Error("The newest production deployment is ambiguous because creation timestamps tie.");
          }
          console.log(`Preflight confirmed ${project.name} is linked to cckhaw/bibliotek and found ${active.length} active deployments.`);
          NODE

  cleanup:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Remove the workflow and clean deployments created by that commit
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WORKFLOW_PATH: .github/workflows/vercel-deployment-cleanup.yml
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
        run: |
          node --input-type=module <<'NODE'
          const vercelApi = "https://api.vercel.com";
          const githubApi = "https://api.github.com";
          const expectedLink = { org: "cckhaw", repo: "bibliotek" };
          const repository = process.env.GITHUB_REPOSITORY;
          const [owner, repo] = repository.split("/");
          const workflowPath = process.env.WORKFLOW_PATH;
          const {
            GH_TOKEN: githubToken,
            VERCEL_TOKEN: vercelToken,
            VERCEL_PROJECT_ID: projectId,
            VERCEL_TEAM_ID: teamId,
          } = process.env;

          for (const [name, value] of Object.entries({
            GH_TOKEN: githubToken,
            VERCEL_TOKEN: vercelToken,
            VERCEL_PROJECT_ID: projectId,
            VERCEL_TEAM_ID: teamId,
          })) {
            if (!value) throw new Error(`Required credential ${name} is unavailable.`);
          }

          async function vercelRequest(path, options = {}) {
            const response = await fetch(`${vercelApi}${path}`, {
              ...options,
              headers: {
                Authorization: `Bearer ${vercelToken}`,
                "Content-Type": "application/json",
                ...options.headers,
              },
            });
            if (!response.ok) throw new Error(`Vercel API request failed with HTTP ${response.status}.`);
            return response.json();
          }

          async function listDeployments(query) {
            const deployments = new Map();
            const cursors = new Set();
            let until;
            for (let page = 0; page < 1000; page += 1) {
              const params = new URLSearchParams({ projectId, teamId, limit: "100", ...query });
              if (until !== undefined) params.set("until", String(until));
              const result = await vercelRequest(`/v7/deployments?${params}`);
              if (!Array.isArray(result.deployments) || !result.pagination) {
                throw new Error("Vercel returned an unexpected deployment-list response.");
              }
              for (const deployment of result.deployments) {
                if (
                  !deployment ||
                  deployment.projectId !== projectId ||
                  typeof deployment.uid !== "string" ||
                  !deployment.uid.startsWith("dpl_") ||
                  !Number.isSafeInteger(Number(deployment.created)) ||
                  Number(deployment.created) <= 0 ||
                  typeof deployment.state !== "string" ||
                  typeof deployment.readyState !== "string" ||
                  !Object.hasOwn(deployment, "target")
                ) {
                  throw new Error("A deployment has incomplete or mismatched identity data.");
                }
                const previous = deployments.get(deployment.uid);
                if (previous && JSON.stringify(previous) !== JSON.stringify(deployment)) {
                  throw new Error(`Deployment ${deployment.uid} changed between pagination pages.`);
                }
                deployments.set(deployment.uid, deployment);
              }
              const next = result.pagination.next;
              if (next === null) return [...deployments.values()];
              const cursor = Number(next);
              if (!Number.isSafeInteger(cursor) || cursor <= 0 || cursors.has(cursor) || (until !== undefined && cursor >= until)) {
                throw new Error("Vercel returned an invalid or non-advancing pagination cursor.");
              }
              cursors.add(cursor);
              until = cursor;
            }
            throw new Error("Deployment pagination exceeded the safety limit.");
          }

          function isActive(deployment) {
            return deployment.state !== "DELETED" && deployment.readyState !== "DELETED" && !deployment.deleted;
          }

          function classify(deployment) {
            if (deployment.customEnvironment) {
              throw new Error(`Deployment ${deployment.uid} uses a custom environment; cleanup scope is ambiguous.`);
            }
            if (deployment.target === "production") return "production";
            if (deployment.target === null) return "preview";
            throw new Error(`Deployment ${deployment.uid} has an unsupported target; cleanup scope is ambiguous.`);
          }

          function plan(deployments) {
            const active = deployments.filter(isActive);
            const scoped = active.map((deployment) => ({ deployment, environment: classify(deployment) }));
            const production = scoped.filter(({ environment }) => environment === "production");
            if (production.length === 0) throw new Error("No active production deployment was found.");
            const latestTimestamp = production.reduce(
              (latest, { deployment }) => Math.max(latest, Number(deployment.created)),
              -Infinity,
            );
            const latest = production.filter(({ deployment }) => Number(deployment.created) === latestTimestamp);
            if (latest.length !== 1) throw new Error("The newest production deployment is ambiguous because creation timestamps tie.");
            const retained = latest[0].deployment;
            const deletions = scoped
              .filter(({ deployment }) => deployment.uid !== retained.uid)
              .map(({ deployment, environment }) => ({ deployment, environment }));
            return { active, retained, deletions };
          }

          function snapshot(deployments) {
            return JSON.stringify(
              deployments
                .map(({ uid, created, target, state, readyState, deleted, customEnvironment }) => ({
                  uid,
                  created,
                  target,
                  state,
                  readyState,
                  deleted: Boolean(deleted),
                  customEnvironment: Boolean(customEnvironment),
                }))
                .sort((a, b) => a.uid.localeCompare(b.uid)),
            );
          }

          async function verifyProject() {
            const query = new URLSearchParams({ teamId });
            const project = await vercelRequest(`/v9/projects/${encodeURIComponent(projectId)}?${query}`);
            if (
              project.id !== projectId ||
              !["github", "github-limited"].includes(project.link?.type) ||
              project.link.org !== expectedLink.org ||
              project.link.repo !== expectedLink.repo
            ) {
              throw new Error("The configured Vercel project is not unambiguously linked to cckhaw/bibliotek.");
            }
            return project;
          }

          const project = await verifyProject();
          const beforeRemoval = plan(await listDeployments({}));
          console.log(`Verified ${project.name}; preflight found ${beforeRemoval.active.length} active deployments.`);

          const githubHeaders = {
            Accept: "application/vnd.github+json",
            Authorization: `Bearer ${githubToken}`,
            "X-GitHub-Api-Version": "2022-11-28",
          };
          const workflowUrl = `${githubApi}/repos/${owner}/${repo}/contents/${workflowPath}`;
          const currentWorkflow = await fetch(`${workflowUrl}?ref=main`, { headers: githubHeaders });
          if (!currentWorkflow.ok) {
            throw new Error(`Could not read the temporary workflow before removal (HTTP ${currentWorkflow.status}).`);
          }
          const workflow = await currentWorkflow.json();
          if (workflow.path !== workflowPath || typeof workflow.sha !== "string") {
            throw new Error("The workflow file identity could not be verified; it was not removed.");
          }
          const removalResponse = await fetch(workflowUrl, {
            method: "DELETE",
            headers: { ...githubHeaders, "Content-Type": "application/json" },
            body: JSON.stringify({
              message: "Remove temporary Vercel deployment cleanup workflow",
              sha: workflow.sha,
              branch: "main",
            }),
          });
          if (!removalResponse.ok) {
            throw new Error(`Could not remove the temporary workflow (HTTP ${removalResponse.status}).`);
          }
          const removal = await removalResponse.json();
          const removalCommit = removal.commit?.sha;
          if (typeof removalCommit !== "string" || !/^[a-f0-9]{40}$/i.test(removalCommit)) {
            throw new Error("The workflow-removal commit could not be verified.");
          }
          console.log(`Removed the temporary workflow; waiting for the production deployment for commit ${removalCommit}.`);

          const terminalStates = new Set(["READY", "ERROR", "CANCELED", "BLOCKED", "DELETED"]);
          const deadline = Date.now() + 15 * 60 * 1000;
          let previousSignature;
          let stablePolls = 0;
          let matchingDeployments = [];
          while (Date.now() < deadline) {
            matchingDeployments = await listDeployments({ sha: removalCommit });
            const productionForCommit = matchingDeployments.filter((deployment) => deployment.target === "production");
            if (
              productionForCommit.length > 0 &&
              matchingDeployments.every(
                (deployment) => terminalStates.has(deployment.state) && terminalStates.has(deployment.readyState),
              )
            ) {
              const signature = snapshot(matchingDeployments);
              stablePolls = signature === previousSignature ? stablePolls + 1 : 0;
              previousSignature = signature;
              if (stablePolls >= 2) break;
            } else {
              stablePolls = 0;
              previousSignature = undefined;
            }
            await new Promise((resolve) => setTimeout(resolve, 10_000));
          }
          if (stablePolls < 2) {
            throw new Error("No stable, completed production deployment for the workflow-removal commit was confirmed; cleanup stopped.");
          }

          const initial = await listDeployments({});
          const initialPlan = plan(initial);
          console.log(`Keeping newest production deployment ${initialPlan.retained.uid} (created ${initialPlan.retained.created}).`);
          console.log(`Deleting ${initialPlan.deletions.length} other preview/production deployments.`);
          for (const { deployment, environment } of initialPlan.deletions) {
            console.log(`Planned deletion: ${deployment.uid} (${environment}, created ${deployment.created}).`);
          }

          const confirmed = await listDeployments({});
          if (snapshot(initial) !== snapshot(confirmed)) {
            throw new Error("The deployment list changed during final preflight; no deployments were changed.");
          }

          for (const { deployment } of initialPlan.deletions) {
            const query = new URLSearchParams({ teamId });
            const result = await vercelRequest(`/v13/deployments/${encodeURIComponent(deployment.uid)}?${query}`, {
              method: "DELETE",
            });
            if (result.state !== "DELETED" || result.uid !== deployment.uid) {
              throw new Error(`Deletion of ${deployment.uid} was not confirmed; stopping further deletions.`);
            }
            console.log(`Deleted ${deployment.uid}.`);
          }

          const remaining = await listDeployments({});
          const remainingActive = remaining.filter(isActive);
          const remainingPlan = plan(remaining);
          if (
            remainingPlan.retained.uid !== initialPlan.retained.uid ||
            remainingPlan.deletions.length !== 0 ||
            snapshot(remainingActive) !== snapshot([initialPlan.retained])
          ) {
            throw new Error("Post-cleanup verification failed; deployments may remain.");
          }
          console.log(`Verified ${initialPlan.retained.uid} is the only remaining preview/production deployment.`);
          NODE
