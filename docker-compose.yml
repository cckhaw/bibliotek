services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: bibliotek
      POSTGRES_PASSWORD: bibliotek
      POSTGRES_DB: bibliotek
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
volumes:
  pgdata:
